name: Latest blog post workflow
on:
  schedule: # Run workflow automatically
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Run workflow manually

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # 1. The Proxy Feed (Fixes the broken images)
          feed_list: "https://medium-rss-v2.vercel.app/feed/@hasupeksha2002"
          
          # 2. Settings to find the image correctly
          tag_post_image: "image"
          max_post_count: 2
          
          # 3. The "Nice" Template (Adds rounded corners, shadow, and clean text)
          template: "<td><div style='border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border: 1px solid #e1e4e8;'><a href='$url'><img width='100%' style='display:block; object-fit: cover;' src='$image' /></a><div style='padding: 10px;'><a href='$url' style='text-decoration: none; color: inherit;'><b>$title</b></a><br/><br/><span style='color: gray; font-size: 12px;'>$date</span></div></div></td>"
